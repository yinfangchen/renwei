expected_outcome: |
  反向 AI 腔化（reverse.md 子模式二）：把一段朋友圈随手记改成教科书级 AI 腔，给分享做前后对比。产出要一眼就是 AI：
  宏大开头、提醒读者插入语、行首 emoji 分点、加粗属性列表、句式造深度、总分总收束、升华结尾、万能夸词，至少用上五类。
  用户已经说了是拿来做分享对比的，不必再提醒这是演示品；交付说明（用了哪些手法、事实没动）要和正文对得上。用户说了原文件别动，xiangshan.md 保持原样，AI 腔版本贴在回复里。
  事实一个不少（周六、香山、人多、排队 40 分钟坐缆车、山顶风大、待十分钟就下来、门票 10 块、缆车单程 80），
  一个不添（不写红叶、秋天、海拔、风景、同行人、新数字）；人多、排队、风大、很快下山这些不愉快的经历不被翻成正面，
  也不加推荐或打分。拔高只许对原有的事拔高。
