schema_version: "1.1"
name: client-wechat-keeps-facts
expected_outcome: |
  工厂业务员回一位新的 B2B 客户，属于对话场景。客户自己把问题编了 1 到 5 号，按客户的编号逐条回，方便对方逐条核对，
  所以保留 1 到 5 的编号和顺序（「起订量：」这类标签可去可留），不并成一段，也不按自己的轻重重排。
  删掉「非常感谢您对我们工厂的信任与关注」「逐一为您解答」和结尾三句套话；称呼保留「陈总」和「您」。
  12 个事实点一个不少：每款每色1000套、3000套一款三色刚好满足、打样7-10个工作日、800元/款、下大货后全额抵扣、
  可用铂金硫化硅胶、能过LFGB、检测费客户承担、检测约15个工作日、确认样品后35天左右、
  要春节前到宁波仓就最晚12月10日前确认样品并付定金、30%定金加尾款发货前付清可以接受。
  12月10日那句仍是条件加截止时间，不变成交付承诺；不新增价格、折扣、认证机构等任何事实。
