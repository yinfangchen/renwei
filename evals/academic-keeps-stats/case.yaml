schema_version: "1.1"
name: academic-keeps-stats
expected_outcome: |
  学术论文结论段，属于正式书面场景。三处「显著」都是统计结论：「在1%的水平上显著」给出显著性水平，
  「更为显著」是组间比较，「在统计上并不显著」是零结果；「在一定程度上」「可能」是证据强度的限定语。
  这些全部逐字保留，数字、数据来源、模型和变量名也不动，语体仍是书面学术，不改成第一人称或口语。
  可以处理的是结尾「本研究不仅丰富了……更为……提供了有益的政策启示」这类贡献套话：把它拆平，主张留着（「可为……政策提供参考」），不整句删。
  开头的「综上所述」在结论段里是惯例，可留；导师已经嫌 AI 味重，孤立的那处「值得注意的是」也换成论文自己的承接（「分消费类型看」）。不得新增政策建议、首创性主张或因果判断。
  如果顺手提醒用户「中西部地区更为显著」需要组间差异检验支撑（这是内容问题，不是文风问题），更好。
context:
  scaffold_script: place-files.sh
