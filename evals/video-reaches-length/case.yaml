schema_version: "1.1"
name: video-reaches-length
expected_outcome: |
  书面产品文案改成约一分钟的口播稿，属于短视频口播场景，换文体整篇重写。原文信息很少，干念不到 30 秒，
  用户要一分钟，所以要用口播自己的手段补足时长：演示的停顿（「你看，按一下就换档」）、把数字换成生活里的说法
  （充一次电用一个月、出差半个月不用带充电器这种从 30 天直接推出的换算）、信息点之间的缓冲、结尾回扣开头。
  这些只换说法、不加事实：不编品牌、价格、声波频率、美白护龈之类原文没有的功效，也不替用户编使用经历（「我用了半年」）。
  「建议三个月换一次」的「建议」保留，不说成必须。三档、30 天、三个月、IPX7、能带进浴室，一个不少。
  稿子正文（不算拍摄提示和说明）念下来接近一分钟，大约 180 字以上；补完还短，再说明差多少、问用户要素材。
