schema_version: "1.1"
name: work-email-europeanized
expected_outcome: |
  给老板的工作邮件，属于正式书面场景。「还是要正式一点」是对语体的约束，仍走正向去 AI 味，不读 reverse.md，
  更不能往里注入「进行沟通」这类官腔。四处「进行＋动词」还原成动词，「对于……的相关事宜」「通过对……的精简……实现……的目标」
  「做出最终的决定」「这一时间节点存在一定的不确定性」这类介词框架、虚化动词和名词化拆成直说，删掉的不换成「开展」「予以」。
  「预计」「约12%」「初步」和上线时间还不确定、要和供应商确认的说法原样保留；称呼、落款和正式语体不变；
  返点一句仍是经销商对「返点政策调整」的顾虑，不改成「担心会调整」；不新增立场、建议、原因或行动项。
context:
  scaffold_script: place-files.sh
