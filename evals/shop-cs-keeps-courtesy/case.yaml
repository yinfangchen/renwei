schema_version: "1.1"
name: shop-cs-keeps-courtesy
expected_outcome: |
  这是真人客服写的售后回复：道歉、自助排查、换新条件和寄回方式一条消息说全，买家不用再问第二轮。
  判定尺度里真客服文本的礼数豁免：「亲」「您」、道歉和「有问题随时找我」是职业礼貌，
  对话场景包的收紧和篇幅规则不能取消这条豁免。这条消息里真正多余的是说了两遍的道歉；用户嫌它像机器人，开场那句模板式道歉可以换成对着这件事说的道歉，道歉本身留着。
  理想结果：说明这条已经挺自然，只去掉重复的那句道歉、顺一下订单号那句；「您」和至少一句道歉保留，
  排查步骤、换新条件、来回运费、顺丰到付、不用垫钱、订单号纸条一条不少，不新增任何承诺。
context:
  scaffold_script: place-files.sh
