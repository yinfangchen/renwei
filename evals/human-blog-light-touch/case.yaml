schema_version: "1.1"
name: human-blog-light-touch
expected_outcome: |
  这段是真人写的博客：细节具体又不均匀（菜市场七点收摊、自己七点二十到家、冒菜一份三十多、「你这是在喂猫」），
  「首先」「事实上」「显著」各只出现一次，不成聚集，破折号也只有一处，所以不重写。但朋友已经说读着有 AI 味，
  这几处辨识度最高的词（「显著」「事实上」、破折号）可以点改，词或标点级、合计不超过三处。
  回复要告诉用户这段整体读着像真人写的、说出依据，再说明朋友读出 AI 味多半是哪几个词。
  不拆段，不给「首先」补「其次」，不加标题、编号或 emoji，不重写整句；所有细节和引语原样保留。
  长文案场景包的「从严」「最有货的段落扩开、再扩一段压一段」管的是整篇 AI 文章，不适用于这段文字。
context:
  scaffold_script: place-files.sh
